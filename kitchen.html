<title>Vicio Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: left rail of pages (top strip on phones), one page at a time; cards, lined task lists, mono labels. Cherry is the one accent. */
:root{
  --bg:#F6F5F3; --surface:#FFFFFF; --ink:#18181B; --muted:#5E5E66; --line:#E4E2DF;
  --cherry:#8B1E1E; --cherry-ink:#FFFFFF; --cherry-soft:#F6E6E4;
  --good:#1F7A4D; --good-soft:#E3F2EA; --warn:#A15C00; --warn-soft:#FFF3E0; --bad:#B3261E; --bad-soft:#FBE7E5;
  --f-display:'Oswald','Arial Narrow',Arial,sans-serif; --f-body:'Public Sans','Segoe UI',Helvetica,Arial,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1B1B1F; --ink:#EDEDF0; --muted:#A1A1AA; --line:#2E2E34;
  --cherry:#E0575A; --cherry-ink:#FFFFFF; --cherry-soft:#3A1618;
  --good:#4CC38A; --good-soft:#15301F; --warn:#F0A43A; --warn-soft:#33240F; --bad:#FF6B6B; --bad-soft:#3C1B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1B1B1F; --ink:#EDEDF0; --muted:#A1A1AA; --line:#2E2E34;
  --cherry:#E0575A; --cherry-ink:#FFFFFF; --cherry-soft:#3A1618;
  --good:#4CC38A; --good-soft:#15301F; --warn:#F0A43A; --warn-soft:#33240F; --bad:#FF6B6B; --bad-soft:#3C1B18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
#rail{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:0 10px;color:var(--ink)}
.brand svg{height:34px;width:auto;display:block}
.brand-sub{font-size:12px;color:var(--muted);padding:8px 10px 14px;letter-spacing:.06em;text-transform:uppercase}
.navgroup{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
#tabs button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font:600 14.5px var(--f-body);color:var(--ink);cursor:pointer}
#tabs button:hover{background:var(--bg)}
#tabs button[aria-current="page"]{background:var(--cherry-soft);color:var(--cherry)}
#tabs button.lang{width:auto;border:1px solid var(--line);font:600 12px var(--f-mono);padding:6px 10px;margin-left:auto;letter-spacing:.06em}
.pct{font:500 11px var(--f-mono);color:var(--muted)}
#tabs button[aria-current="page"] .pct{color:var(--cherry)}
.who{margin-top:auto;padding:16px 10px 0;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.who b{display:block;color:var(--ink);font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}
main{padding-block:32px 64px;padding-inline:clamp(16px,4vw,48px);min-width:0}
.wrap{max-width:900px}
.eyebrow{font:500 12px var(--f-mono);color:var(--cherry);letter-spacing:.04em;text-transform:uppercase}
h1{font-family:var(--f-display);font-size:clamp(32px,5vw,44px);line-height:1.02;margin:6px 0 10px;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase;font-weight:700}
h2{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.02em;text-transform:uppercase;font-weight:600}

p{margin:0}

.standard span{font:500 11px var(--f-mono);color:var(--cherry);letter-spacing:.06em;text-transform:uppercase}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px}

.date{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;min-width:0}

.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 12px var(--f-mono);color:var(--muted)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{border-top:1px solid var(--line)}

.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.fld{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0;letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],textarea,select{font:400 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--cherry)}
select{font-weight:600;font-size:13px;padding:7px 8px}
select.s3{border-color:var(--good);color:var(--good)}
select.s2{border-color:var(--warn);color:var(--warn)}
td input[type=text]{padding:6px 8px;font-size:14px}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-mono);white-space:nowrap;text-align:right}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}

.tl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;position:relative;margin-top:22px}
.tl div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:14px;min-width:0}
.tl div small{display:block;font:500 11px var(--f-mono);letter-spacing:.02em;color:var(--muted);text-transform:none}

.pay{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}

.goal{color:var(--muted);font-size:14px}

.status{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}

.link{background:none;border:0;padding:0;font:600 14px var(--f-body);color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover,.link[aria-expanded="true"]{color:var(--cherry);text-decoration-color:var(--cherry)}
.tlink{font:500 12px var(--f-mono);color:var(--cherry)}
tr.rcrow>td{background:var(--bg);padding:14px}

.ph.empty{aspect-ratio:4/3;display:grid;place-items:center;padding:12px}
table.ing{min-width:0}
table.ing td{padding:4px 6px}
.btn.x{min-height:32px;padding:4px 10px}

label.btn{position:relative;display:inline-flex;align-items:center;justify-content:center}

.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:600 15px var(--f-body);color:var(--ink);cursor:pointer;min-height:48px}

/* Two modes per device (Eric, Nov 1 2026). Prep: opening and closing lists, dough, cleaning, counts, logs, everything as before.
   Service: online orders, the 86 board, temps and line notes, nothing else in the way.
   The clock picks Service Thursday, Friday and Saturday from 6:30 PM to close (midnight Thursday, 1 AM Friday and Saturday).
   A tap overrides the clock until the clock's own pick changes, which is the next shift. Both modes read the same data. */
const MODES=[['prep','Prep'],['service','Service']],SVC_TABS=['today','logs','recipes'];
/* On deck (Eric, Nov 1 2026): what should be ready to go during service. One big checkbox per line.
   Each line: [key saved in ondeck.items, count, what]. Change the counts or lines here. */
const ONDECK=[['cheese',2,'Cheese ready'],['pepperoni',2,'Pepperoni ready'],['loaded',4,'loaded with cheese in the fridge']];
/* During service hours a tap on Prep holds only while someone is using the page: 5 minutes with no touch, scroll or typing
   (and nothing focused) puts the board back on Service. */
const PREP_IDLE=5*60e3;let lastTouch=Date.now();
['pointerdown','keydown','input','scroll','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now()},{capture:true,passive:true}));
function autoMode(){const n=new Date(Date.now()-7*3600e3),dw=n.getUTCDay(),m=n.getUTCHours()*60+n.getUTCMinutes();
  if([4,5,6].includes(dw)&&m>=18*60+30)return 'service';
  if((dw===6||dw===0)&&m<60)return 'service';
  return 'prep'}
function modeOverride(){try{const o=JSON.parse(localStorage.getItem('vicio_boh_mode')||'null');if(o&&o.m&&o.auto===autoMode()&&Date.now()-(o.at||0)<18*3600e3)return o.m}catch(e){}return null}
function curMode(){return modeOverride()||autoMode()}
function setMode(m){try{localStorage.setItem('vicio_boh_mode',JSON.stringify({m,auto:autoMode(),at:Date.now()}))}catch(e){}ui.mode=m;if(m==='service'&&!SVC_TABS.includes(ui.tab))ui.tab='today'}
function modeSwitch(){const o=modeOverride();return `<div class="modesw"><div class="seg2" role="group" aria-label="Mode">${MODES.map(([k,n])=>`<button type="button" data-act="mode" data-v="${k}" aria-pressed="${ui.mode===k}">${n}</button>`).join('')}</div><span class="status">${o?'Set by hand until the next shift':'Set by the clock'}</span></div>`}
ui.mode=curMode();

function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=x.getDay();x.setDate(x.getDate()-w);return x}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const fmt=(d,o)=>{const x=parse(d);if(o&&o.day==null)return x.toLocaleDateString('en-US',o);const md=(x.getMonth()+1)+'/'+x.getDate()+'/'+x.getFullYear();return o&&o.weekday?x.toLocaleDateString('en-US',{weekday:'long'})+' '+md:md};

const L={data:{},subs:[]};

function lsave(){try{localStorage.setItem('vicio_local',JSON.stringify(L.data))}catch(e){}}
function lnotify(){L.subs.forEach(s=>s())}
function deep(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deep(a[k]&&typeof a[k]==='object'?a[k]:{},b[k])}else a[k]=b[k]}return a}
function watchDoc(path,cb){
  if(db)return db.doc(path).onSnapshot(s=>cb(s.exists?s.data():{}),()=>cb({}));
  const f=()=>cb(L.data[path]||{});L.subs.push(f);f();return()=>{L.subs=L.subs.filter(x=>x!==f)};
}
function watchCol(col,cb){
  if(db)return db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cb(o)},()=>cb({}));
  const f=()=>{const o={};for(const p in L.data){if(p.startsWith(col+'/'))o[p.slice(col.length+1)]=L.data[p]}cb(o)};L.subs.push(f);f();return()=>{};
}
async function getDoc(path){
  if(db){try{const g=await db.doc(path).get();return g.exists?g.data():{}}catch(e){return {}}}
  return L.data[path]||{};
}
const queue={};
function save(path,patch){
  const run=async()=>{
    setStatus('Saving');
    try{
      if(db){const ref=db.doc(path);try{await ref.update(patch)}catch(e){await ref.set(patch)}}
      else{L.data[path]=deep(L.data[path]||{},patch);lsave();lnotify()}
      setStatus('Saved','ok')
    }catch(e){setStatus('Not saved. Check your access and try again.','bad')}
  };
  queue[path]=(queue[path]||Promise.resolve()).then(run);
  return queue[path];
}
let syncBase='',syncTimer=null;
/* kind: 'base' sets the standing label, 'ok' flashes then returns to it, 'bad' stays until the next save, none means in progress. */
function setStatus(t,kind){const el=document.getElementById('sync');if(!el)return;clearTimeout(syncTimer);
  if(kind==='base'){syncBase=t;el.textContent=tr(t);el.className='';return}
  el.textContent=tr(t);el.className=kind||'';
  if(kind==='ok')syncTimer=setTimeout(()=>{el.textContent=tr(syncBase);el.className=''},1800)}

/* ---------- derived ---------- */
const pct=(done,items)=>Math.round(100*items.filter(i=>done[i[0]]).length/items.length);
function startDate(){return S.cfg.start||''}
function dayNum(){const s=startDate();if(!s)return null;return Math.floor((parse(iso(new Date()))-parse(s))/864e5)+1}
function verdict(kind,v,cfg){
  if(v==null||v==='')return 'none';
  if(kind==='food'||kind==='labor'){const t=kind==='food'?cfg.foodT:cfg.laborT;if(t==null||t==='')return 'none';return v<=t?'good':'bad'}
  if(kind==='apps')return v>=0&&v<=10?'good':'bad';
  if(kind==='entrees')return v<=15?'good':'bad';
  if(kind==='logs')return v>=100?'good':'bad';
  return 'none';
}
function weekKeys(){return Object.keys(S.weeks).sort()}
function streak(){
  const ks=weekKeys().reverse();let n=0;
  for(const k of ks){const m=S.weeks[k].m||{};
    if(verdict('food',m.food,{foodT:S.cfg.foodT})==='good'&&verdict('labor',m.labor,{laborT:S.cfg.laborT})==='good')n++;else break}
  return n;
}

/* ---------- views ---------- */
function checklist(path,items,done){
  return '<ul class="checks">'+items.map(i=>`<li><label><input type="checkbox" data-chk="${path}|${i[0]}"${done[i[0]]?' checked':''}><span>${esc(i[1])}</span></label></li>`).join('')+'</ul>';
}
function progress(p){return `<div class="progress${p===100?' done':''}"><i style="width:${p}%"></i></div>`}

function vToday(){
  const sh=S.shift,done=Object.assign({},sh.done||{});
  if(logsComplete(ui.date))done.service_logs=true;
  const cards=Object.entries(SHIFT).map(([k,g])=>{
    const items=g.items.map(i=>[k+'_'+i[0],i[1]]);
    const p=pct(done,items);
    return `<section class="card edge"><div class="cardhead"><h3>${g.title}</h3><span class="count">${items.filter(i=>done[i[0]]).length} of ${items.length}</span></div>${progress(p)}${checklist('shifts/'+ui.date,items,done)}</section>`;
  }).join('');
  return `<h2>Manager checks</h2><div class="grid">${cards}</div>`;
}
function shiftPct(d){const done=Object.assign({},S.shift.done||{});if(logsComplete(d))done.service_logs=true;return pct(done,Object.entries(SHIFT).flatMap(([k,g])=>g.items.map(i=>[k+'_'+i[0]])))}

function vWeek(){
  const w=S.weeks[ui.week]||{},done=w.done||{},m=w.m||{};
  const end=addDays(ui.week,6),p=pct(done,WEEKLY);
  const cur=ui.week===iso(monday(new Date()));
  const num=(id,label,hint,step)=>`<label class="fld">${label}<input type="number" min="0" step="${step||'0.1'}" inputmode="decimal" data-metric="${id}" value="${esc(m[id]??'')}" placeholder="${hint}"></label>`;
  const verdicts=['food','labor','apps','entrees','logs'].map(k=>[k,verdict(k,m[k],{foodT:S.cfg.foodT,laborT:S.cfg.laborT})]);
  const names={food:'Food cost',labor:'Kitchen labor',apps:'Apps',entrees:'Entrees',logs:'Logs'};
  return `
  <div class="bar"><div class="nav"><button class="btn" data-act="wprev" aria-label="Previous week">Back</button>
    <div class="date">${esc(fmt(ui.week,{month:'short',day:'numeric'}))} to ${esc(fmt(end,{month:'short',day:'numeric'}))}${cur?' <span class="pill good">This week</span>':''}</div>
    <button class="btn" data-act="wnext" aria-label="Next week">Next</button>${cur?'':'<button class="btn" data-act="wtoday">This week</button>'}</div></div>
  <div class="grid">
    <section class="card edge"><div class="cardhead"><h3>Every week</h3><span class="count">${WEEKLY.filter(i=>done[i[0]]).length} of ${WEEKLY.length}</span></div>${progress(p)}${checklist('weeks/'+ui.week,WEEKLY,done)}</section>
    <section class="card"><h3>This week's numbers</h3>
      <div class="fields">
        ${num('food','Food cost, % of sales','Target '+(S.cfg.foodT??'not set'))}
        ${num('labor','Kitchen labor, % of sales','Target '+(S.cfg.laborT??'not set'))}
        ${num('apps','Apps ticket time, avg minutes','6 to 10')}
        ${num('entrees','Entrees ticket time, avg minutes','10 to 15')}
        ${num('logs','Compliance logs completed, %','Goal 100','1')}
        ${num('waste','Waste, dollars','Total for week','0.01')}
      </div>
      <div class="legend">${verdicts.map(([k,v])=>`<span class="pill ${v}">${names[k]}: ${v==='good'?'On target':v==='bad'?'Off target':'No data'}</span>`).join('')}</div>
      <p class="status">Pull ticket times from the Toast kitchen reports.</p>
    </section>
  </div${vFoodCost()}`;
}

function fcCat(d){if(/^(LABEL|BOX|WRAP|FILTER|CLEANER)/.test(d))return 'sup';if(/^(SODA|SYRUP|WATER)/.test(d))return 'bev';return 'food'}

  const beg=num(fc.beg),end=num(fc.end),sales=num(fc.sales);const cogs=beg!=null&&end!=null?beg+t.food-end:t.food;
  const pctv=sales?Math.round(cogs/sales*1000)/10:null;return {t,cogs,pct:pctv,full:beg!=null&&end!=null}}

function fcLive(){const w=S.weeks[ui.week]||{};const c=fcCalc(w.fc);const g=id=>document.getElementById(id);if(!g('fc_food'))return;

function kQuizBy(){const by={};Object.values(S.kquiz||{}).filter(r=>r&&r.name&&r.quiz).forEach(r=>{const k=String(r.name).trim().toLowerCase();const p=by[k]=by[k]||{name:r.name,pid:r.pid||null,q:{}};if(r.pid)p.pid=r.pid;const e=p.q[r.quiz]=p.q[r.quiz]||{best:0,pass:false,n:0};e.best=Math.max(e.best,r.pct||0);e.pass=e.pass||!!r.pass;e.n++});return by}

  const t=w=>TUNITS.every(u=>{const r=tempOf(d,u,w);return r&&num(r.f)!=null});
  return [['Temps at open',t('Open')],['Fryer oil',dayLogs(d,'oil').length>0],['Waste',dayLogs(d,'waste').length>0],['Sanitizer',['Line buckets','Dish machine'].every(w=>dayLogs(d,'sanitizer').some(r=>r.where===w))],['Temps at close',t('Close')]];
}
function logsWhen(d){const mx=a=>a.length?Math.max(...a):0,t=w=>mx(TUNITS.map(u=>{const r=tempOf(d,u,w);return r&&r.created||0})),last=ty=>mx(dayLogs(d,ty).map(r=>r.created||0));
  return [t('Open'),last('oil'),last('waste'),last('sanitizer'),t('Close')]}
function logsComplete(d){return logsStatus(d).every(x=>x[1])}
function logAdd(type,fields){const id=newId(),d=Object.assign({type,date:ui.logDate,by:ui.by||'',created:Date.now()},fields);S.logs=Object.assign({},S.logs,{[id]:d});save('logs/'+id,d);render()}
function logSet(id,patch){S.logs=Object.assign({},S.logs,{[id]:Object.assign({},S.logs[id],patch)});save('logs/'+id,patch)}
function lsum(r){
  const v=k=>esc(r[k]??'');
  if(r.type==='temp')return `${v('unit')} ${v('f')}°F at ${(r.when||'').toLowerCase()}`;
  if(r.type==='oil')return r.state?`Fryer oil: ${v('state')}`:`Fryer oil ${(r.act||'').toLowerCase()}${r.color?', '+r.color.toLowerCase():''}`;
  if(r.type==='waste')return `Waste: ${v('item')}${r.amt?', '+v('amt'):''}${r.reason?' ('+v('reason').toLowerCase()+')':''}`;
  if(r.type==='sanitizer')return `Sanitizer, ${v('where').toLowerCase()}: ${v('res')}`;
  if(r.type==='cooling')return `Cooling: ${v('item')}${num(r.t2)!=null?', '+v('t2')+'°F at 2 hr':''}${num(r.t6)!=null?', '+v('t6')+'°F at 6 hr':''}`;
  if(r.type==='receiving')return `Received ${v('item')} from ${v('vendor')}${num(r.f)!=null?', '+v('f')+'°F':''}${r.rej?'. Rejected: '+v('rej'):''}`;
  if(r.type==='maint')return `${v('kind')}: ${v('what')}. ${v('issue')} (${(r.status||'').toLowerCase()})`;
  return v('type')}
function ltime(ms){return ms?new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''}
function chips(g,opts,sel){return `<div class="chips">${opts.map(o=>`<button type="button" class="chip" data-act="lchip" data-g="${g}" data-v="${esc(o)}" aria-pressed="${sel===o}">${esc(o)}</button>`).join('')}</div>`}
function tempCard(when,d){
  const rows=TUNITS.map(u=>{const r=tempOf(d,u,when),f=r?num(r.f):null,fz=/freez/i.test(u),bad=r&&lflag(r);
    return `<div class="lrow"><span><b>${esc(u)}</b><small class="muted"> ${fz?'0 °F or below':'41 °F or below'}</small></span>
      <input class="lnum" type="number" step="1" inputmode="decimal" data-lt="${esc(u)}|${when}" value="${f==null?'':esc(f)}" aria-label="${esc(u)} temp at ${when.toLowerCase()}" placeholder="°F">
      <span class="pill ${f==null?'none':bad?'bad':'good'}">${f==null?'—':bad?'High':'OK'}</span><p class="twarn"${bad?'':' hidden'}>Out of range. Check the unit or fix the entry. Eric gets this in the 3 AM email.</p></div>`}).join('');

}

function logClicks(a,t){
  const g=id=>document.getElementById(id),val=id=>{const el=g(id);return el?el.value.trim():''};
  if(a==='lprev'||a==='lnext')ui.logDate=addDays(ui.logDate||iso(new Date()),a==='lprev'?-1:1);
  if(a==='ltoday')ui.logDate=iso(new Date());
  if(a==='loghist')ui.logHist=!ui.logHist;
  if(a==='logtab')ui.logType=t.dataset.k;
  if(a==='lchip'){const g=t.dataset.g,v=ui.lsel[g]===t.dataset.v?null:t.dataset.v;ui.lsel[g]=v;document.querySelectorAll(`[data-act=lchip][data-g="${g}"]`).forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===v)));return}
  if(a==='logoil'){logAdd('oil',{state:t.dataset.v});return}
  if(a==='logwaste'){const sel=g('lw_sel')?g('lw_sel').value:'';const item=sel==='Other'?val('lw_item'):sel;if(!item){(sel==='Other'?g('lw_item'):g('lw_sel')).focus();return}logAdd('waste',{item,amt:val('lw_amt'),reason:ui.lsel.wreason||''});ui.lsel.wreason=null;ui.lsel.witem=null;ui.lsel.wother='';return}
  if(a==='lognowaste'){logAdd('waste',{item:'Nothing wasted',amt:'',reason:''});return}
  if(a==='logsan'){logAdd('sanitizer',{res:t.dataset.v,where:t.dataset.w});return}
  if(a==='logcool'){const item=val('lc_item');if(!item){g('lc_item').focus();return}logAdd('cooling',{item,t2:null,t6:null});return}
  if(a==='logrecv'){const item=val('lr_item'),vendor=val('lr_vendor');if(!item&&!vendor){g('lr_vendor').focus();return}logAdd('receiving',{vendor,item,f:num(val('lr_f')),rej:val('lr_rej')});return}
  if(a==='logmaint'){const what=val('lm_what');if(!what){g('lm_what').focus();return}logAdd('maint',{kind:val('lm_kind'),what,issue:val('lm_issue'),status:'Open'});return}
  render();
}
function logChanges(t){
  if(t.id==='lw_sel'){ui.lsel.witem=t.value;const o=document.getElementById('lw_item');if(o){o.hidden=t.value!=='Other';if(t.value==='Other')o.focus()}return true}
  if(t.id==='lby'){ui.by=t.value.trim();try{localStorage.setItem('vicio_by',ui.by)}catch(e){}return true}
  if(t.dataset.lt){const[unit,when]=t.dataset.lt.split('|'),v=num(t.value),r=tempOf(ui.logDate,unit,when);
    if(r)logSet(r.id,{f:v,by:ui.by||r.by||''});else if(v!=null)logAdd('temp',{unit,when,f:v});
    return true}
  if(t.dataset.lcool){const[id,k]=t.dataset.lcool.split('|');if(S.logs[id])logSet(id,{[k]:num(t.value)});return true}
  return false;
}

function vProbation(){

  const review=s?fmt(addDays(s,89),{weekday:'short',month:'long',day:'numeric',year:'numeric'}):'';
  const miles=S.miles.done||{};
  const total=PHASES.reduce((a,p)=>a+p.items.length,0);
  const got=PHASES.reduce((a,p)=>a+p.items.filter(i=>miles[p.key+i[0]]).length,0);
  return `
  <div class="grid">
    <section class="card edge"><h3>Where she is</h3>

      ${n==null?'<div class="empty">Enter the start date to begin the 90 day clock.</div>':`
      <div class="kpis">

        <div class="kpi"><b>${n<1?90:left}</b><span>Days left</span></div>
        <div class="kpi"><b>${got}/${total}</b><span>Milestones met</span></div>

      <p class="muted">90 day review with Jessica, Edson, and Eric: <b style="color:var(--ink)">${esc(review)}</b></p>`}
    </section>
    <section class="card"><h3>After day 90</h3>
      <p class="muted">Full Kitchen Manager ownership: ordering, scheduling, hiring, food cost, and labor. Payroll questions go to Jessica.</p>
    </section>
  </div>
  <div class="grid">${PHASES.map((p,i)=>{
    const c=p.items.filter(x=>miles[p.key+x[0]]).length;
    return `<section class="card ${i===phase?'edge':''}"><div class="cardhead"><h3>${p.name}</h3><span class="count">${p.days}</span></div>${progress(Math.round(100*c/p.items.length))}
    <ul class="checks">${p.items.map(x=>`<li><label><input type="checkbox" data-chk="config/miles|${p.key+x[0]}"${miles[p.key+x[0]]?' checked':''}><span>${esc(x[1])}</span></label></li>`).join('')}</ul></section>`}).join('')}</div>`;
}

function chart(keys){
  if(keys.length<2)return '<div class="empty">Enter food cost and labor for two or more weeks to see the trend.</div>';
  const W=640,H=220,l=40,r=14,t=14,b=30;
  const ser=[['food','Food cost','var(--cherry)',S.cfg.foodT],['labor','Labor','var(--ink)',S.cfg.laborT]];
  const vals=[];ser.forEach(s=>{keys.forEach(k=>{const v=(S.weeks[k].m||{})[s[0]];if(v!=null&&v!=='')vals.push(+v)});if(s[3]!=null&&s[3]!=='')vals.push(+s[3])});
  if(!vals.length)return '<div class="empty">Enter food cost and labor for two or more weeks to see the trend.</div>';
  const mx=Math.ceil(Math.max(...vals)/5)*5+5,mn=0;
  const x=i=>l+i*(W-l-r)/(keys.length-1),y=v=>t+(H-t-b)*(1-(v-mn)/(mx-mn));
  let g='';for(let v=0;v<=mx;v+=mx/5){g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}%</text>`}
  keys.forEach((k,i)=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(fmt(k,{month:'numeric',day:'numeric'}))}</text>`});
  ser.forEach(s=>{
    if(s[3]!=null&&s[3]!=='')g+=`<line x1="${l}" x2="${W-r}" y1="${y(+s[3])}" y2="${y(+s[3])}" stroke="${s[2]}" stroke-dasharray="5 4" opacity=".6"/>`;
    const pts=keys.map((k,i)=>{const v=(S.weeks[k].m||{})[s[0]];return v==null||v===''?null:[x(i),y(+v),v]}).filter(Boolean);
    if(pts.length)g+=`<polyline fill="none" stroke="${s[2]}" stroke-width="2.5" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s[2]}"/>`).join('');
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Food cost and kitchen labor percent of sales by week, with targets as dashed lines">${g}</svg>
  <div class="legend"><span><i style="background:var(--cherry)"></i>Food cost</span><span><i style="background:var(--ink)"></i>Kitchen labor</span><span>Dashed lines are your targets</span></div>`;
}

function vPlan(){

  const got=all.filter(k=>done[k]).length;
  const phases=PHASES.map((ph,pi)=>{const ks=PLAN.flatMap((w,i)=>w.p===pi?w.items.map((t,j)=>'w'+(i+1)+'_'+j):[]);return [ph.name,ks.filter(k=>done[k]).length,ks.length]});

    <div class="kpi"><b>${got}/${all.length}</b><span>Plan tasks done</span></div>
    ${phases.map(p=>`<div class="kpi"><b>${p[1]}/${p[2]}</b><span>${esc(p[0])}</span></div>`).join('')}
  </div>
  ${PLAN.map((wk,i)=>{

    const items=wk.items.map((t,j)=>['w'+(i+1)+'_'+j,t]);

}

function rchart(rows){
  const W=640,rh=34,l=150,r=40,H=rows.length*rh+8;
  const col=['var(--line)','var(--muted)','var(--warn)','var(--good)'];
  let g='';
  rows.forEach((row,i)=>{
    const y=4+i*rh,tot=row.c.reduce((a,b)=>a+b,0);let x=l;
    g+=`<text x="${l-10}" y="${y+20}" text-anchor="end">${esc(row.name)}</text>`;
    [3,2,1,0].forEach(k=>{const w=(W-l-r)*row.c[k]/tot;if(w>0)g+=`<rect x="${x}" y="${y+6}" width="${w}" height="20" fill="${col[k]}"/>`;x+=w});
    g+=`<text x="${W-r+8}" y="${y+20}">${row.c[3]}/${tot}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recipes signed off by category">${g}</svg>

const RC_W={lb:16,oz:1,g:0.035274},RC_V={gal:128,'fl oz':1,cup:8,tbsp:0.5,tsp:1/6};
function rcBase(r){const[a,b,u]=r[2].split('/');const A=+a||1,B=+b||1;
  if(/^LB/.test(u))return{k:'w',q:A*B*16,per:r[4]==='LB'?r[3]/16:r[3]/(A*B*16)};
  if(u==='OZ')return{k:'wv',q:A*B,per:r[3]/(A*B)};
  if(u==='GL')return{k:'v',q:A*B*128,per:r[3]/(A*B*128)};
  if(u==='FO')return{k:'v',q:A*B,per:r[3]/(A*B)};
  if(u==='DZ')return{k:'e',q:A*B*12,per:r[3]/(A*B*12)};
  if(u==='CN')return{k:'e',q:A,per:r[3]/A};
  return{k:'e',q:A*B,per:r[3]/(A*B)}}
function rcUnits(r){const k=rcBase(r).k;return k==='w'?Object.keys(RC_W):k==='v'?Object.keys(RC_V):k==='wv'?[...Object.keys(RC_W),...Object.keys(RC_V)]:['each']}

function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const m=1000;if(w>m||h>m){const k=Math.min(m/w,m/h);w=Math.round(w*k);h=Math.round(h*k)}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);let q=.75,d=cv.toDataURL('image/jpeg',q);while(d.length>180000&&q>.3){q-=.1;d=cv.toDataURL('image/jpeg',q)}res(d)};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

function pullWalk(o,out,seen){
  if(o==null||seen.size>400)return;
  if(typeof o==='string'){const t=o.trim();if(t[0]==='{'||t[0]==='['){try{pullWalk(JSON.parse(t),out,seen)}catch(e){}}return}
  if(typeof o!=='object')return;
  if(Array.isArray(o)){o.forEach(x=>pullWalk(x,out,seen));return}
  if(typeof o.subject==='string'&&(o.uri||o.id)){const k=o.id||o.uri;if(!seen.has(k)){seen.add(k);out.push(o)}}
  Object.keys(o).forEach(k=>{if(k!=='body')pullWalk(o[k],out,seen)});
}
function pullMessages(r){const out=[],seen=new Set();pullWalk(r&&r.payload,out,seen);pullWalk(r&&r.structuredContent,out,seen);(r&&r.content||[]).forEach(b=>b&&b.text&&pullWalk(b.text,out,seen));return out}
function pullBody(o,d){
  d=d||0;if(o==null||d>8)return '';
  if(typeof o==='string'){const t=o.trim();if(t[0]==='{'){try{return pullBody(JSON.parse(t),d+1)}catch(e){}}return ''}
  if(typeof o!=='object')return '';
  if(o.body&&typeof o.body.content==='string')return o.body.content;
  for(const k of Object.keys(o)){const v=pullBody(o[k],d+1);if(v)return v}
  return '';
}
function pullShifts(html,recv){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('br').forEach(b=>b.replaceWith(' '));
  doc.querySelectorAll('style,script').forEach(n=>n.remove());
  let t=(doc.body.textContent||'').replace(/\s+/g,' ');
  const cut=t.search(/View my schedule|Need extra hours/i);if(cut>0)t=t.slice(0,cut);
  const re=/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{1,2}):(\d\d)\s*([AP]M)\s*[-–]\s*(\d{1,2}):(\d\d)\s*([AP]M)\s+(.+?)(?=\s+(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+[A-Z][a-z]{2}\s+\d{1,2}\s+\d{1,2}:\d\d|\s*$)/g;
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],rd=new Date(recv||Date.now()),out=[];let m;
  while((m=re.exec(t))){
    const mi=MO.indexOf(m[2]);if(mi<0)continue;
    const y=rd.getFullYear()+(mi<rd.getMonth()-6?1:0);
    const role=m[10].replace(/^(Vicio|C[eé]ntrico)\s+/i,'').replace(/-/g,' ').trim();
    out.push({date:iso(new Date(y,mi,+m[3])),start:(+m[4])+':'+m[5]+' '+m[6],end:(+m[7])+':'+m[8]+' '+m[9],role:role,org:/^C[eé]ntrico/i.test(m[10])?'Céntrico':'Vicio'});
  }
  return out;
}

function navPct(id){
  try{
    if(id==='today')return shiftPct(ui.date)+'%';
    if(id==='week')return pct((S.weeks[ui.week]||{}).done||{},WEEKLY)+'%';
    if(id==='logs')return '';
    if(id==='test'){let a=0,b=0;trainees().forEach(p=>STATIONS.forEach(([k])=>{b++;if(tstat(p.id,k)==='s')a++}));return b?a+'/'+b:''}
    if(id==='todo'){const t=Object.values(S.todos);const o=t.filter(x=>!x.done).length;return o?String(o):''}
    if(id==='cleaning'){const dn=(S.clean[cleanWeek(iso(new Date()))]||{}).done||{};return pct(dn,CLEANALL)+'%'}
    if(id==='inventory')return pct((S.weeks[ui.week]||{}).done||{},INVFORMS)+'%';
    if(id==='month')return pct((S.months[ui.month]||{}).done||{},MONTHLY)+'%';
    if(id==='probation'){const m=S.miles.done||{};let a=0,b=0;PHASES.forEach(p=>p.items.forEach(x=>{b++;if(m[p.key+x[0]])a++}));return a+'/'+b}
    if(id==='plan'){const d=S.plan.done||{};let a=0,b=0;PLAN.forEach((w,i)=>w.items.forEach((t,j)=>{b++;if(d['w'+(i+1)+'_'+j])a++}));return a+'/'+b}

  }catch(e){}
  return '';
}

document.addEventListener('change',e=>{

  if(t.dataset.handoff){save('handoff/'+t.dataset.handoff,{text:t.value.trim(),by:ui.by||'',at:Date.now()});return}

  if(t.dataset.ptoggle){save(t.dataset.ptoggle,{done:t.checked});return}

  if(t.dataset.note){save('shifts/'+ui.date,{notes:{[t.dataset.note]:t.value}});return}
  if('waste' in t.dataset){save('shifts/'+ui.date,{waste:t.value===''?null:+t.value});return}
  if(t.dataset.rcl!=null&&t.dataset.rcf){const id=ui.rSel,i=+t.dataset.rcl,l=(rcGet(id).lines||[]).map(z=>Object.assign({},z));const f=t.dataset.rcf;
    l[i][f]=f==='a'?(t.value===''?null:+t.value):t.value;if(f==='n'){const r=CENTRICO.find(z=>z[0]===t.value);if(r&&!rcUnits(r).includes(l[i].u))l[i].u=rcUnits(r)[0]}
    rcSave(id,{lines:l});t.blur();render();return}
  if(t.dataset.rcy){rcSave(t.dataset.rcy,{yield:t.value===''?1:+t.value});t.blur();render();return}
  if(t.dataset.fcq){const v=t.value===''?null:+t.value;fcSet({q:{[t.dataset.fcq]:v}});save('weeks/'+ui.week,{fc:{q:{[t.dataset.fcq]:v}}});return}
  if(t.dataset.fcf){const v=t.value===''?null:+t.value;fcSet({[t.dataset.fcf]:v});save('weeks/'+ui.week,{fc:{[t.dataset.fcf]:v}});return}
  if(t.dataset.metric){save('weeks/'+ui.week,{m:{[t.dataset.metric]:t.value===''?null:+t.value}});return}
  if(t.dataset.mfield){const v=t.dataset.mfield==='viol'?(t.value===''?null:+t.value):t.value;save('months/'+ui.month,{[t.dataset.mfield]:v});return}
  if(t.dataset.notify){save('config/main',{notifyTo:t.value.trim()});return}
  if(t.id==='ev-paste'){ui.evPaste=t.value;return}
  if(t.dataset.cfg){save('config/main',{[t.dataset.cfg]:t.value===''?null:+t.value});return}
  if(t.id==='startdate'){save('config/main',{start:t.value});return}
  if(t.dataset.rs){const v=+t.value;save('recipes/book',{items:{[t.dataset.rs]:{s:v,d:v===3?iso(new Date()):null}}});return}
  if(t.dataset.rw){save('recipes/book',{items:{[t.dataset.rw]:{w:t.value}}});return}
  if('twho' in t.dataset){ui.tWho=t.value||null;t.blur();render();return}
  if(t.dataset.train){const[pid,k]=t.dataset.train.split('|');S.training[pid]=Object.assign({},S.training[pid],{st:Object.assign({},(S.training[pid]||{}).st,{[k]:t.value})});save('training/'+pid,{st:{[k]:t.value}});t.blur();render();return}
  if(t.dataset.ing){const[id,i,f]=t.dataset.ing.split('|'),g=ingOf(id);if(!g[+i])return;g[+i][f]=f==='g'?(t.value===''?null:+t.value):t.value;S.rcards[id]=Object.assign({},S.rcards[id],{ing:g});save('rcards/'+id,{ing:g});return}
  if(t.dataset.rc){const[id,f]=t.dataset.rc.split('|'),v=f==='portion'?(t.value===''?null:+t.value):t.value;S.rcards[id]=Object.assign({},S.rcards[id],{[f]:v});save('rcards/'+id,{[f]:v});return}
  if(t.dataset.photo&&t.files&&t.files[0]){const id=t.dataset.photo,f=t.files[0];t.value='';photoToast('');
    compress(f).then(d=>{PHOTO[id]=d;save('rphotos/'+id,{img:d});save('rcards/'+id,{hasPhoto:true});render()}).catch(()=>{alertPhoto(id);photoToast(isHeic(f)?'heic':'bad')});return}
});
function alertPhoto(id){PHOTO[id]=PHOTO[id]||null;render()}
/* A photo this browser can't read (an iPhone HEIC picked on a Mac, mostly) used to fail with no message. Now it says so and stays up until tapped. */
function isHeic(f){return /image\/hei[cf]/i.test(f&&f.type||'')||/\.hei[cf]$/i.test(f&&f.name||'')}
function photoToast(kind){let el=document.getElementById('phototoast');
  if(!kind){if(el)el.hidden=true;return}
  if(!el){el=document.createElement('div');el.id='phototoast';el.setAttribute('role','alert');el.addEventListener('click',()=>{el.hidden=true});document.body.appendChild(el)}
  const es=lang()==='es';
  el.innerHTML=`<span>${kind==='heic'?(es?'No se pudo leer la foto. Las fotos HEIC desde una Mac no cargan aquí: súbela desde el iPhone o iPad, o guárdala como JPEG primero.':'Couldn\'t read that photo. HEIC photos from a Mac don\'t load here: upload from the iPhone or iPad, or save it as JPEG first.'):(es?'No se pudo leer la foto. Prueba con un JPEG o PNG.':'Couldn\'t read that photo. Try a JPEG or PNG.')}</span><button type="button" aria-label="${es?'Cerrar':'Close'}">×</button>`;
  el.hidden=false}
