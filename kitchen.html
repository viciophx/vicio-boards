<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vicio Kitchen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#F6F5F3;color:#18181B}@media (prefers-color-scheme:dark){body{background:#161214;color:#F3EFEF}}#ld{padding:32px 20px}</style>
</head>
<body>
<p id="ld">Loading the board…</p>
<script>
/* The board is stored in 7 parts in the kitchen folder, joined here and opened as the page. */
(async function(){
  var n=7, folder='kitchen';
  try {
    var texts=await Promise.all(Array.from({length:n},function(_,i){
      return fetch(folder+'/part'+(i+1)+'.txt',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()});
    }));
    document.open(); document.write(texts.join('')); document.close();
  } catch (e) {
    document.getElementById('ld').textContent='The board could not load. Check the connection and refresh.';
  }
})();
</script>
</body>
</html>
