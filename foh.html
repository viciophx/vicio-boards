<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vicio FOH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: same system as the Vicio Kitchen Tracker. Menu of pages across the top, one page at a time; cards, lined task lists, mono labels. Cherry is the one accent. */
/* Always dark, on every device and in every viewer theme: the kitchen tracker's dark palette. */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#111113; --surface:#1B1B1F; --ink:#EDEDF0; --muted:#A1A1AA; --line:#2E2E34;
  --cherry:#E0575A; --cherry-ink:#FFFFFF; --cherry-soft:#3A1618;
  --good:#4CC38A; --good-soft:#15301F; --warn:#F0A43A; --warn-soft:#33240F; --bad:#FF6B6B; --bad-soft:#3C1B18;
  --f-display:'Oswald','Arial Narrow',Arial,sans-serif; --f-body:'Public Sans','Segoe UI',Helvetica,Arial,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--bg)}
/* Host stand: bigger type and a full-width floor for the iPad at the door. Only on Reservations. */
html.big body{font-size:18px}
html.big .seatlayout{grid-template-columns:minmax(0,1fr)}
html.big .floor{aspect-ratio:10/6.5}
html.big .tbl{font-size:24px;padding:6px}
html.big .tbl small{font-size:14px;max-width:180px}
html.big .btn{min-height:52px;font-size:17px}
html.big .legend{font-size:16px}
html.big .status,html.big .count{font-size:15px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
#rail{background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 20px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{color:var(--ink);flex:none;display:flex;align-items:baseline;gap:10px}
.brand svg{height:28px;width:auto;display:block}
.brand-sub{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#tabs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;flex:1 1 500px;min-width:0}
#tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:6px 10px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer;white-space:nowrap}
#tabs button:hover{background:var(--bg)}
#tabs button[aria-current="page"]{background:var(--cherry-soft);color:var(--cherry)}
#tabs button.lang{border:1px solid var(--line);font:600 12px var(--f-mono);letter-spacing:.08em;padding:6px 10px;margin-left:auto}
.pct{font:500 11px var(--f-mono);color:var(--muted)}
#tabs button[aria-current="page"] .pct{color:var(--cherry)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}
main{padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);min-width:0}
.wrap{max-width:1280px}
.eyebrow{font:500 12px var(--f-mono);color:var(--cherry);letter-spacing:.04em;text-transform:uppercase}
h1{font-family:var(--f-display);font-size:clamp(32px,5vw,44px);line-height:1.02;margin:6px 0 10px;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase;font-weight:700}
h2{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.02em;text-transform:uppercase;font-weight:600}
h3{font-family:var(--f-display);font-size:18px;margin:0;letter-spacing:.03em;text-transform:uppercase;font-weight:600;line-height:1.2}
p{margin:0}
.lede{color:var(--muted);max-width:68ch;margin:0 0 22px}
.headline{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;margin:6px 0 18px}.headline h1{margin:0;flex:none}.headline .lede{margin:0;flex:1 1 320px;font-size:14px;line-height:1.4}
.muted{color:var(--muted)}
#view{display:flex;flex-direction:column;gap:18px}
.standard{border-left:3px solid var(--cherry);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;display:grid;gap:2px}
.standard span{font:500 11px var(--f-mono);color:var(--cherry);letter-spacing:.06em;text-transform:uppercase}
.standard p{font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--cherry);border-color:var(--cherry);color:var(--cherry-ink)}
.btn:hover{border-color:var(--cherry);color:var(--cherry)}
.btn.primary:hover{color:var(--cherry-ink)}
.date{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;min-width:0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;min-width:0}
.card.edge{border-color:var(--cherry)}
.progress{height:6px;background:var(--line);position:relative;border-radius:999px;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--cherry);display:block;border-radius:999px}
.progress.done i{background:var(--good)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 12px var(--f-mono);color:var(--muted)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;min-height:52px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.checks input{width:34px;height:34px;margin:0;accent-color:var(--cherry);cursor:pointer;flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.grp{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap;vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.status{font-size:12px;color:var(--muted)}
textarea,input[type=number]{font:400 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus{border-color:var(--cherry)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
td input[type=number]{width:88px;padding:6px 8px;font:600 15px var(--f-mono);text-align:right;min-height:40px}
tr.counted td:first-child{color:var(--muted)}
.qr{width:120px;height:120px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.fields>.fld-full,.fields>.rvline{grid-column:1/-1}.fld-full>.fld{display:grid}
.rvline{display:grid;gap:12px;grid-template-columns:minmax(0,1.3fr) minmax(70px,.6fr) minmax(0,1fr)}
@media (max-width:380px){.rvline{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rvline>.fld:first-child{grid-column:1/-1}}
.fld{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0;letter-spacing:.02em}
details.fold details.fold{background:var(--bg)}
.url{font:500 11px var(--f-mono);color:var(--muted);word-break:break-all}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:600 15px var(--f-body);color:var(--ink);cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--cherry)}
.opt[aria-pressed="true"]{border-color:var(--cherry);background:var(--cherry-soft);color:var(--cherry)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);cursor:default}
.opt:disabled{opacity:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.qtext{font:600 22px/1.25 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.score{font:700 56px/1 var(--f-display)}
.feedback{font-weight:600}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
input[type=text]{font:400 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0;min-height:44px}
.startrow{display:flex;gap:8px;flex-wrap:wrap}.startrow input{flex:1 1 220px;width:auto}
ul.miss{margin:0;padding-left:20px;display:grid;gap:8px}ul.miss small{display:block;color:var(--good);font-weight:600}
/* Schedule and Staff, same planner styles as the kitchen tracker */
input[type=date],select{font:400 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;min-height:44px}
.plegend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spill{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--f-body);padding:3px 9px;border-radius:999px;margin:1px 3px 1px 0;white-space:nowrap;background:var(--cherry-soft);color:var(--cherry);border:1px solid var(--cherry)}
.sx{all:unset;cursor:pointer;padding:0 2px;font-size:15px;line-height:1;opacity:.7}.sx:hover{opacity:1}
.plabel{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.nextwk>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}.nextwk>summary::-webkit-details-marker{display:none}.nextwk>summary::before{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}.nextwk[open]>summary::before{transform:rotate(45deg)}
.pdow,.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pdow span{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.pcell{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:124px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pcell.past{background:var(--bg)}
.pcell.closed{opacity:.6}
.pcell.sel{border:2px solid var(--ink);padding:7px}
.pcell:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}
.pdn{display:flex;justify-content:space-between;align-items:baseline}
.pdn b{font:600 20px var(--f-display);line-height:1}
.pdn i{display:none;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-style:normal}
.pcell.today .pdn b{background:var(--cherry);color:var(--cherry-ink);padding:2px 7px;border-radius:6px}
.pchip{font:600 11.5px var(--f-body);line-height:1.2;padding:3px 6px;border-radius:6px;background:var(--cherry);color:var(--cherry-ink);align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.pchip.ev{background:var(--warn-soft);color:var(--warn)}
.pwho{font-size:12px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pwho b{font-weight:700}
.pln{font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}.pln.d{color:var(--muted);text-decoration:line-through}
.pmore{font-size:11.5px;color:var(--muted)}
ul.plist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;flex-wrap:wrap}
ul.plist label{flex:1;min-width:0}
.ptag{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none}
.ptag.k{color:var(--good);border-color:var(--good)}
/* Seating chart: tables placed by percent on a dotted floor, colored by status */
.fixture{position:absolute;transform:translate(-50%,-50%);display:grid;place-content:center;background:var(--line);border:2px solid var(--muted);border-radius:4px;color:var(--muted);font:600 18px var(--f-display);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
/* Something sitting on a fixture, like the DJ booth on the bar top */
.fixture.on{background:var(--surface);border:2px dashed var(--muted);font-size:14px;color:var(--ink);z-index:1}
.fixsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fixsvg polygon{fill:var(--line);stroke:var(--muted);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.fixlabel{position:absolute;transform:translate(-50%,-50%);color:var(--muted);font:600 18px var(--f-display);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.floor{position:relative;width:100%;max-width:100%;aspect-ratio:10/7;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.floor.edit{touch-action:none;border:2px dashed var(--cherry)}
.tbl{position:absolute;transform:translate(-50%,-50%);display:grid;place-content:center;gap:1px;text-align:center;border:2px solid var(--good);background:var(--surface);color:var(--ink);font:600 16px/1 var(--f-display);letter-spacing:.02em;cursor:pointer;padding:4px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.tbl small{font:500 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.round{border-radius:50%}.tbl.square{border-radius:10px}.tbl.long,.tbl.tall{border-radius:10px}.tbl.stool{border-radius:50%}
.tbl.seated{border-color:var(--cherry);background:var(--cherry-soft)}
.tbl.seated.long{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.byline{display:block;font:500 10px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.signin .padd{margin-top:4px}
.wl .ptime{min-width:90px}
.tbl.reserved{border-color:var(--warn);background:var(--warn-soft)}
.tbl.dirty{border-color:var(--bad);background:var(--bad-soft)}
.tbl.resv{border-style:dashed;border-color:var(--warn)}
.tbl.event{border-style:dashed;border-color:var(--cherry);background:var(--cherry-soft)}
.tbl.sel{box-shadow:0 0 0 3px var(--ink)}
.floor.edit .tbl{border-style:dashed;border-color:var(--muted);background:var(--surface)}
.floor.edit .tbl.sel{border-color:var(--cherry)}
.stbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stbtns .btn{justify-content:center;min-height:48px}
.stbtns .btn.on.open{background:var(--good);border-color:var(--good);color:var(--bg)}
.stbtns .btn.on.seated{background:var(--cherry);border-color:var(--cherry);color:var(--cherry-ink)}
.stbtns .btn.on.reserved{background:var(--warn);border-color:var(--warn);color:var(--bg)}
.stbtns .btn.on.dirty{background:var(--bad);border-color:var(--bad);color:var(--bg)}
/* BEO receipt: always white paper with dark ink, whatever the page theme */
.receipt{background:#FFFFFF;color:#161616;font:500 13px/1.45 var(--f-mono);padding:26px 22px 34px;max-width:440px;margin:0 auto;width:100%;box-shadow:0 12px 32px rgba(0,0,0,.45);display:grid;gap:10px;overflow-wrap:anywhere}
.receipt .rhead{display:grid;justify-items:center;text-align:center;gap:2px;font-size:12px;color:#444}
.receipt .rhead b{font:700 30px/1 var(--f-display);letter-spacing:.12em;color:#161616;margin-bottom:6px}
.receipt .rrule{border-top:1px dashed #9a9a9a;margin:2px 0}
.receipt .rtitle{text-align:center;font-weight:700;letter-spacing:.14em;display:grid;gap:2px}
.receipt .rtitle span{font-weight:500;letter-spacing:.02em;color:#555;font-size:12px}
.receipt .rkv{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px}
.receipt .rkv span:first-child{color:#666;font-size:11px;letter-spacing:.08em;padding-top:1px}
.receipt .rsec{display:grid;gap:4px}
.receipt .rsec b{letter-spacing:.14em;font-size:12px;margin-bottom:2px}
.receipt .rline{display:flex;align-items:baseline;gap:6px}
.receipt .rline i{flex:1;border-bottom:1px dotted #9a9a9a;min-width:12px;transform:translateY(-4px)}
.receipt .rline span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.receipt .rline.b{font-weight:700;font-size:14px}
.receipt .rfoot{text-align:center;font-size:11px;color:#666;letter-spacing:.06em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.otype{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:12px;text-align:left;min-height:72px;padding:12px 14px}
.btn.otype svg{width:36px;height:36px;color:var(--cherry)}
.btn.otype>span{display:grid;gap:2px}
.btn.otype .status{white-space:normal}
.otypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.otypes .btn.otype{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:10px 12px}.otypes .btn.otype svg{width:30px;height:30px}
@media (max-width:760px){.otypes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tvwk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-bottom:6px}
.tvnight{gap:8px;padding:12px 14px}.tvnight.on{border-color:var(--cherry)}
.tvnhead{display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.tvnhead b{font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase}.tvnhead span{font:600 12px var(--f-body);color:var(--cherry)}
.tvnl{list-style:none;margin:0;padding:0;display:grid;gap:6px}.tvnl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.35}
.tvnl .status{display:block;font-size:11.5px;white-space:normal}
.tvk{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:2px}.tvk.snd{color:var(--cherry)}
.tvnotes summary{cursor:pointer;font:600 12px var(--f-body);color:var(--muted)}.tvnotes ul{font-size:12.5px;margin:6px 0 0}
.audio .grp{margin-top:12px}
.hday,.hcell{background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:6px;font:inherit;color:inherit;cursor:pointer;text-align:left;min-height:32px}
.hday{font-weight:700;color:var(--cherry);text-decoration:underline;text-underline-offset:3px}
.hday:hover,.hcell:hover{background:var(--cherry-soft)}
.lday{margin-left:10px;padding:2px 9px;border-radius:999px;background:var(--cherry-soft);color:var(--cherry);font:600 12px var(--f-body);letter-spacing:0;text-transform:none;vertical-align:middle;white-space:nowrap}.lday b{font-weight:700}

const ESRX=[[/^(\d+) of (\d+)$/,'$1 de $2'],[/^Done (.+)$/,'Listo $1'],[/^Whole night (\d+%)$/,'Toda la noche $1'],[/^Left: (.+)$/,'Faltan: $1'],[/^On tonight$/,'Esta noche'],[/^Question (\d+) of (\d+)$/,'Pregunta $1 de $2'],[/^(\d+) on$/,'$1 en turno'],[/^Week of (.+)$/,'Semana del $1']];
function tr(t){if(ui.lang!=='es'||t==null)return t;const k=String(t).trim();if(ES[k]!=null)return String(t).replace(k,ES[k]);for(const [rx,rep] of ESRX){if(rx.test(k))return String(t).replace(k,k.replace(rx,rep))}return t}
function translateDom(){
  if(ui.lang!=='es'||!document.createTreeWalker)return;
  ['tabs','head','view'].forEach(id=>{const root=document.getElementById(id);if(!root)return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{const v=n.nodeValue;if(!v||!v.trim())return;const t=tr(v);if(t!==v)n.nodeValue=t});
    root.querySelectorAll('[placeholder]').forEach(el=>{const t=tr(el.placeholder);if(t!==el.placeholder)el.placeholder=t})});
}
/* ---------- state ---------- */
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)}
function sunday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const fmt=(d,o)=>parse(d).toLocaleDateString('en-US',o);
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');

/* The service date: Vicio closes at 1 AM, so until 5 AM the night still belongs to the day before. */
function svcDate(){const n=new Date();if(n.getHours()<5)n.setDate(n.getDate()-1);return iso(n)}
const ui={tab:'today',date:svcDate(),week:iso(sunday(parse(svcDate()))),area:'Inside'};
/* Who is on this iPad tonight: picked from the roster each shift, never carried to the next night. */
try{const w=JSON.parse(localStorage.getItem('vicio_foh_who')||'null');ui.who=w&&w.date===svcDate()?w:null}catch(e){ui.who=null}
try{ui.lang=localStorage.getItem('vicio_foh_lang')||'en'}catch(e){ui.lang='en'}
const whoName=()=>ui.who&&ui.who.name||'';
function setWho(name){ui.who=name?{name,date:svcDate()}:null;try{if(name)localStorage.setItem('vicio_foh_who',JSON.stringify(ui.who));else localStorage.removeItem('vicio_foh_who')}catch(e){}render()}

/* Saves that fail for lack of signal wait on this device and go out when it comes back. A refusal (managers only) is never retried. */
const PQ={items:[],busy:false};

/* update merges a patch into an existing document. Only when it rejects because the document does not exist yet is the document created with set; any other failure is passed on, so the save waits in the queue instead of replacing the whole record with the patch. A transient outage gets one short retry. */
const isRefusal=e=>{const c=String(e&&e.code||'');return /^(not_granted|permission_denied|not_writer|forbidden)$/i.test(c)};
async function writeDoc(path,patch){const ref=db.doc(path);
  const once=async()=>{try{await ref.update(patch)}catch(e){
    if(String(e&&e.code||'')!=='invalid_argument')throw e;
    const snap=await ref.get();if(snap&&snap.exists)throw e;
    await ref.set(patch)}};
  try{await once()}catch(e){if(String(e&&e.code||'')!=='unavailable')throw e;await new Promise(r=>setTimeout(r,400+Math.random()*600));await once()}}
async function pqFlush(){
  if(!db||PQ.busy||!PQ.items.length)return;PQ.busy=true;
  while(PQ.items.length){const it=PQ.items[0];try{await writeDoc(it.path,it.patch);PQ.items.shift();pqStore()}catch(e){if(isRefusal(e)){PQ.items.shift();pqStore();continue}break}}
  PQ.busy=false;
  setStatus(PQ.items.length?PQ.items.length+' save'+(PQ.items.length>1?'s':'')+' waiting for Wi-Fi.':'Saved. All caught up.',PQ.items.length?'bad':'ok');
}
function save(path,patch){
  const run=async()=>{
    setStatus('Saving');
    try{
      if(db){await writeDoc(path,patch)}
      else{L.data[path]=deep(L.data[path]||{},patch);lsave();lnotify()}
      if(PQ.items.length)pqFlush();else setStatus('Saved','ok')
    }catch(e){
      if(isRefusal(e)){setStatus('Not saved. This account can only view the page. In the Share menu, set it to Contributor (can use), then try again.','bad');return}
      PQ.items.push({path,patch,at:Date.now()});pqStore();
      setStatus('No connection. '+PQ.items.length+' save'+(PQ.items.length>1?'s':'')+' waiting; the page keeps trying.','bad');
    }
  };
  queue[path]=(queue[path]||Promise.resolve()).then(run);
  return queue[path];
}

/* ---------- Seating chart. Layout: seating/layout {tables:[{id,n,seats,shape,area,x,y}], fixtures:[{label,area,x,y,w,h}]}, all in percent of the floor.
   Tonight: seatday/<date> {t:{id:{st,party,size,server,note,at}}}. ---------- */
const AREAS=['Inside','Bar','Patio'];
const SHAPES=[['square','Square'],['round','Round'],['long','Long, side to side'],['tall','Long, front to back'],['stool','Bar stool']];
const TST=[['open','Open'],['seated','Seated'],['reserved','Reserved'],['dirty','Needs bussing']];
const tables=()=>(S.layout.tables||[]).slice();
/* Booked events (deposit paid or confirmed) take over their space for the night. A full buyout takes every area; to-go pickups take nothing. */
const BOOKED_ST=['deposit','confirmed'];
function eventsOn(d){return orders().filter(o=>o.date===d&&BOOKED_ST.includes(o.status)&&o.type!=='togo').sort((a,b)=>mins(a.start)-mins(b.start))}
function eventAreas(o){if(o.type==='buyout')return o.bscope==='interior'?['Inside','Bar']:AREAS.slice();return AREAS.includes(o.space)?[o.space]:[]}
function eventFor(t,d){const area=t.area||'Inside';return eventsOn(d||ui.date).find(o=>eventAreas(o).includes(area))}
const evLabel=o=>o.title||o.client||OTYPEN[o.type]||'Event';
/* Reservation clashes: same table within 90 minutes, or a table in a space an event has taken. */
function resvConflicts(v,skipId){if(!v.table)return [];const m=resvTime(v.time);return resvOn(v.date).filter(r=>r.id!==skipId&&activeResv(r)&&r.table===v.table&&Math.abs(resvTime(r.time)-m)<90)}
function resvEventClash(v){const t=tables().find(x=>x.id===v.table);return t?eventFor(t,v.date)||null:null}
const tstate=id=>((S.seat.t||{})[id])||{};
/* wf widens one table (1.5 = half again as wide) without changing its seats. */
function tblSize(t){const r=tblSize0(t),f=+t.wf||1;return [Math.round(r[0]*f),r[1]]}
/* Elapsed time, short: 48m, 1h 20m. Tables seated past 90 minutes get a warning ring. */
function ago(ms){if(!ms)return '';const m=Math.max(0,Math.round((Date.now()-ms)/60000));return m<60?m+'m':Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'')}
const LONG_SEAT=90;
function tblSize0(t){const s=Math.max(1,+t.seats||2);if(t.shape==='stool')return [46,46];if(t.shape==='long')return [Math.min(220,60+s*14),58];if(t.shape==='tall')return [64,Math.min(200,50+s*20)];const d=Math.min(110,50+s*7);return [d,d]}
/* Bar seats live in the Bar area but also show on Inside, at their own spot (ix, iy) by the bar counter. */
const onInsideToo=t=>(t.area||'Inside')!=='Inside'&&t.ix!=null;
const posOf=t=>ui.area==='Inside'&&onInsideToo(t)?[t.ix,t.iy]:[t.x,t.y];
const shownHere=t=>(t.area||'Inside')===ui.area||(ui.area==='Inside'&&onInsideToo(t));
/* Table sizes are set for a 1000 px wide floor and scale with it, so spacing looks the same on a phone or an iPad. TK trims them for room to walk. */
/* Tables and bar seats 25% bigger than the first trim. On Inside the bar seats stay smaller so B1 to B6 do not touch. */
const TK=0.85*1.25;
const stoolK=()=>ui.area==='Bar'?TK:0.85;
function tblHtml(t){const st=tstate(t.id),[w,h]=tblSize(t),[px,py]=posOf(t),rv=!ui.seatEdit&&(!st.st||st.st==='open')?resvFor(t.id):null,ev=!ui.seatEdit&&!rv&&(!st.st||st.st==='open')?eventFor(t):null,cls=ui.seatEdit?'':(st.st&&st.st!=='open'?st.st:rv?'resv':ev?'event':'');
  /* Bar stools show just their name when open; the seat count only means something on tables. */
  const stool=t.shape==='stool';
  const sub=rv?tshort(rv.time)+' '+first(rv.name):ev?(ev.start?tshort(ev.start)+' ':'')+evLabel(ev):ui.seatEdit?(stool?'':t.seats+' seats'):st.st==='seated'?(stool?(st.party||''):(st.size?st.size+' · ':'')+(st.party?first(st.party)+' · ':'')+ago(st.at)):st.st==='reserved'?(st.party||'Reserved'):st.st==='dirty'?'Bus':(stool?'':t.standing?'Standing':t.seats+' top');
  return `<button type="button" class="tbl ${t.shape||'square'} ${cls}${cls==='seated'&&st.at&&(Date.now()-st.at)/60000>LONG_SEAT?' long':''}${ui.tSel===t.id?' sel':''}" data-act="tsel" data-id="${t.id}" style="left:${px}%;top:${py}%;width:max(40px,${(w*(t.shape==='stool'?stoolK():TK)/10).toFixed(2)}%);height:max(40px,${(h*(t.shape==='stool'?stoolK():TK)/7).toFixed(2)}%)" aria-label="Table ${esc(t.n)}, ${t.seats} seats${cls?', '+esc(cls):''}">${esc(t.n)}${sub?`<small>${esc(sub)}</small>`:''}</button>`}
/* A fixture is a box (x, y, w, h) or one solid outline (pts: [[x,y],...]) with its label at lx, ly. All in percent of the floor. */
function fixHtml(f){
  if(f.pts)return `<svg class="fixsvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="${f.pts.map(p=>(+p[0])+','+(+p[1])).join(' ')}"/></svg>${f.label?`<div class="fixlabel" style="left:${f.lx}%;top:${f.ly}%">${esc(f.label)}</div>`:''}`;
  return `<div class="fixture${f.on?' on':''}" style="left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%" aria-hidden="true">${esc(f.label)}</div>`;
}
function seatPanel(){
  const t=tables().find(x=>x.id===ui.tSel);if(!t)return `<p class="status">${ui.seatEdit?'Tap a table to change it, or drag it to move it.':'Tap a table to seat it or change its status.'}</p>`;
  if(ui.seatEdit)return `<section class="card edge"><div class="cardhead"><h3>Table ${esc(t.n)}</h3><span class="count">${esc(t.area)}</span></div>
    <div class="fields"><label class="fld" for="te-n">Table name<input type="text" id="te-n" value="${esc(t.n)}" autocomplete="off"></label>
    <label class="fld" for="te-s">Seats<input type="number" id="te-s" min="1" max="20" value="${esc(t.seats)}"></label>

    <ul class="checks"><li><label><input type="checkbox" id="te-stand"${t.standing?' checked':''}><span>Standing only, no chairs</span></label></li></ul>
    <div class="nav"><button class="btn primary" data-act="tesave">Save table</button><button class="btn" data-act="tedup">Duplicate</button><button class="btn" data-act="tedel">${ui.tDel===t.id?'Tap again to remove':'Remove table'}</button></div></section>`;
  const st=tstate(t.id),cur=st.st||'open',servers=stPeople().filter(p=>p.group!=='Kitchen');
  return `<section class="card edge"><div class="cardhead"><h3>Table ${esc(t.n)}</h3><span class="count">${esc(t.area)} · ${t.seats} seats${st.at&&cur!=='open'?' · since '+esc(ltime(st.at))+' · '+ago(st.at):''}</span></div>
    <div class="stbtns">${TST.map(([k,l])=>`<button class="btn ${k}${cur===k?' on':''}" data-act="tst" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>
    <div class="fields"><label class="fld" for="tp-party">Party name<input type="text" id="tp-party" value="${esc(st.party||'')}" placeholder="Name or reservation" autocomplete="off" autocorrect="off"></label>
    <label class="fld" for="tp-size">Guests<input type="number" id="tp-size" min="1" max="40" value="${esc(st.size||'')}" inputmode="numeric"></label>
    <label class="fld" for="tp-server">Server<select id="tp-server"><option value="">None</option>${servers.map(p=>`<option${st.server===p.name?' selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label class="fld" for="tp-note">Note<input type="text" id="tp-note" value="${esc(st.note||'')}" placeholder="Birthday, high chair, allergy" autocomplete="off"></label></div>
    <div class="nav"><button class="btn primary" data-act="tpsave">Save details</button><button class="btn" data-act="tclear">Clear table</button></div></section>`;
}
function vSeating(){
  if(ui.area==='Bar')ui.area='Inside';
  const d=ui.date,all=tables(),here=all.filter(shownHere),cnt=k=>all.filter(t=>(tstate(t.id).st||'open')===k).length;
  const covers=all.reduce((n,t)=>n+(tstate(t.id).st==='seated'?(+tstate(t.id).size||0):0),0);
  return `${dateBar(cnt('seated')+' seated · '+covers+' guests')}
  <div class="seatlayout"><div class="seatmain">
  <div class="bar"><div class="nav">${AREAS.filter(a=>a!=='Bar').map(a=>`<button class="btn${ui.area===a?' primary':''}" data-act="tarea" data-v="${a}">${a} <span class="pct" style="margin-left:6px">${all.filter(t=>(t.area||'Inside')===a).length}</span></button>`).join('')}</div>
    <div class="nav"><button class="btn${ui.big?' primary':''}" data-act="bigview" aria-pressed="${ui.big?'true':'false'}">Host stand</button>${!mgr()?'':ui.seatEdit?`<button class="btn" data-act="tadd">Add table</button><button class="btn primary" data-act="tedit">Done</button>`:`<button class="btn" data-act="tedit">Edit layout</button>`}</div></div>
  ${ui.seatEdit?'':`<div class="legend">${TST.map(([k,l])=>`<span><i style="border-color:var(--${k==='open'?'good':k==='seated'?'cherry':k==='reserved'?'warn':'bad'})"></i>${l} ${cnt(k)}</span>`).join('')}${eventsOn(d).length?`<span><i style="border-color:var(--cherry);border-style:dashed"></i>Event ${all.filter(t=>(tstate(t.id).st||'open')==='open'&&eventFor(t)).length}</span>`:''}</div>`}
  ${(()=>{const evs=eventsOn(d).filter(o=>eventAreas(o).includes(ui.area));return evs.length?`<div class="standard"><span>Booked ${d===iso(new Date())?'tonight':'this night'}</span>${evs.map(o=>`<p><b>${esc(evLabel(o))}</b> · ${esc(OTYPEN[o.type]||'')}${o.guests?' · '+esc(o.guests)+' guests':''}${o.start?' · '+esc(o.start)+(o.end?' to '+esc(o.end):''):''} · ${esc(eventAreas(o).length===AREAS.length?'whole room':eventAreas(o).join(', '))} <button class="btn x" data-act="oopen" data-id="${o.id}" data-tab2="events">BEO</button></p>`).join('')}</div>`:''})()}
  <div class="floor${ui.seatEdit?' edit':''}" id="floor">${(S.layout.fixtures||[]).filter(f=>(f.area||'Inside')===ui.area).map(fixHtml).join('')}${ui.area==='Inside'&&!ui.seatEdit?tvMarks(false):''}${here.map(tblHtml).join('')}${here.length?'':`<div class="empty" style="position:absolute;inset:16px;display:grid;place-content:center;text-align:center">${all.length?'No tables in '+esc(ui.area)+' yet.':'No tables yet.'} ${ui.seatEdit?'Tap Add table, then drag it into place.':'Tap Edit layout to lay out the room.'}</div>`}</div>
  ${ui.wlPick?`<div class="standard"><span>Seat from the waitlist</span><p>Tap a table on the floor to seat ${esc(((S.wait.w||{})[ui.wlPick]||{}).name||'the party')}. <button class="btn x" data-act="wlpickcancel">Cancel</button></p></div>`:''}
  ${ui.rvPick?`<div class="standard"><span>Seat a reservation</span><p>Tap a table on the floor to seat ${esc((S.resv[ui.rvPick]||{}).name||'the party')}. <button class="btn x" data-act="rvpickcancel">Cancel</button></p></div>`:''}
  ${seatPanel()}${resvListCard()}${resvFutureCard()}</div>
  <div class="seatside">${resvSection()}${waitSection()}</div></div>`;
}
function saveLayout(list){S.layout=Object.assign({},S.layout,{tables:list});save('seating/layout',{tables:list,updated:Date.now()})}
function patchTable(id,p){saveLayout(tables().map(t=>t.id===id?Object.assign({},t,p):t))}
function seatSet(id,p){const cur=tstate(id),next=Object.assign({},cur,p);S.seat=Object.assign({},S.seat,{t:Object.assign({},S.seat.t||{},{[id]:next})});save('seatday/'+ui.date,{t:{[id]:p}})}
function nextNum(){const ns=tables().map(t=>parseInt(t.n,10)).filter(n=>!isNaN(n));return String(ns.length?Math.max(...ns)+1:1)}
/* Drag tables in Edit layout. Moves the button directly, saves once on release. A press that does not move counts as a tap. */
const drag={};
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.floor.edit .tbl');if(!b)return;
  const f=document.getElementById('floor').getBoundingClientRect();Object.assign(drag,{id:b.dataset.id,el:b,f,x0:e.clientX,y0:e.clientY,moved:false});b.setPointerCapture&&b.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag.el)return;if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>4)drag.moved=true;if(!drag.moved)return;
  const x=Math.min(97,Math.max(3,100*(e.clientX-drag.f.left)/drag.f.width)),y=Math.min(96,Math.max(4,100*(e.clientY-drag.f.top)/drag.f.height));
  drag.x=Math.round(x*10)/10;drag.y=Math.round(y*10)/10;drag.el.style.left=drag.x+'%';drag.el.style.top=drag.y+'%'});
document.addEventListener('pointerup',()=>{if(!drag.el)return;const d=Object.assign({},drag);drag.el=null;if(d.moved){drag.skipUntil=Date.now()+400;ui.tSel=d.id;const t=tables().find(x=>x.id===d.id);patchTable(d.id,t&&ui.area==='Inside'&&onInsideToo(t)?{ix:d.x,iy:d.y}:{x:d.x,y:d.y});render()}});
function seatClick(a,t){
  if(a==='tsel'){if(Date.now()<(drag.skipUntil||0))return true;
    if(ui.rvPick&&!ui.seatEdit){seatResv(ui.rvPick,t.dataset.id);ui.rvPick=null;ui.tSel=t.dataset.id;render();return true}
    if(ui.wlPick&&!ui.seatEdit){seatWait(ui.wlPick,t.dataset.id);ui.wlPick=null;ui.tSel=t.dataset.id;render();return true}
    ui.tSel=t.dataset.id;ui.tDel=null;render();return true}
  if(a==='tarea'){ui.area=t.dataset.v;ui.tSel=null;render();return true}
  if(/^(tedit|tadd|tesave|tedup|tedel)$/.test(a)&&!mgr()){setStatus('Managers only.','bad');return true}
  if(a==='tedit'){ui.seatEdit=!ui.seatEdit;ui.tSel=null;ui.tDel=null;render();return true}
  if(a==='tadd'){const id=newId(),n=nextNum();saveLayout(tables().concat([{id,n,seats:4,shape:'square',area:ui.area,x:50,y:50}]));ui.tSel=id;render();return true}
  const id=ui.tSel;if(!id)return false;
  const g=x=>document.getElementById(x);
  if(a==='tesave'){const p={n:(g('te-n').value||'').trim()||'?',seats:Math.max(1,Math.min(20,+g('te-s').value||1)),shape:g('te-sh').value,area:g('te-a').value,standing:!!(g('te-stand')&&g('te-stand').checked)};document.activeElement&&document.activeElement.blur();patchTable(id,p);if(p.area!==ui.area)ui.area=p.area;render();return true}
  if(a==='tedup'){const t=tables().find(x=>x.id===id);const nid=newId();saveLayout(tables().concat([Object.assign({},t,{id:nid,n:nextNum(),x:Math.min(95,t.x+8),y:Math.min(94,t.y+8)})]));ui.tSel=nid;render();return true}
  if(a==='tedel'){if(ui.tDel!==id){ui.tDel=id;render();return true}saveLayout(tables().filter(t=>t.id!==id));ui.tSel=null;ui.tDel=null;render();return true}
  if(a==='tst'){const v=t.dataset.v;seatSet(id,v==='open'?{st:'open',at:null}:{st:v,at:Date.now()});render();return true}
  if(a==='tpsave'){const sz=g('tp-size').value;const p={party:g('tp-party').value.trim(),size:sz===''?null:Math.max(1,+sz),server:g('tp-server').value,note:g('tp-note').value.trim()};if(!tstate(id).st||tstate(id).st==='open'){p.st='seated';p.at=Date.now()}document.activeElement&&document.activeElement.blur();seatSet(id,p);render();return true}
  if(a==='tclear'){seatSet(id,{st:'open',party:'',size:null,server:'',note:'',at:null});render();return true}
  return false;
}

/* ---------- Reservations: one doc per booking in resv/{id} {date, time, name, size, phone, table, note, st, created}. ---------- */
const RST=[['booked','Booked','none'],['confirmed','Confirmed','good'],['seated','Seated','good'],['noshow','No-show','warn'],['canceled','Canceled','none']];
const RSTN=Object.fromEntries(RST.map(r=>[r[0],r]));
const RTIMES=(()=>{const o=[];for(let m=16*60;m<=24*60+30;m+=15){const h=Math.floor(m/60)%24,mm=m%60;o.push(((h%12)||12)+':'+String(mm).padStart(2,'0')+' '+(h<12?'AM':'PM'))}return o})();
const resvTime=t=>{const m=mins(t);return m<5*60?m+24*60:m};
function resvOn(d){return Object.entries(S.resv||{}).map(([id,r])=>({id,...r})).filter(r=>r.date===d).sort((a,b)=>resvTime(a.time)-resvTime(b.time)||(a.created||0)-(b.created||0))}

const tblName=id=>(tables().find(t=>t.id===id)||{}).n||'';
/* The next booking waiting on a table tonight, for the floor map. */
function resvFor(tid){return resvOn(ui.date).find(r=>r.table===tid&&activeResv(r))}
/* The reservation form keeps what was typed in ui.rvDraft, so a refresh from another iPad never wipes it. */
const rvKey=r=>r&&r.id?r.id:'new';
function resvForm(r){
  const v=Object.assign({},r||{},((ui.rvDraft||{})[rvKey(r)])||{}),tl=tables().slice().sort((a,b)=>AREAS.indexOf(a.area)-AREAS.indexOf(b.area)||String(a.n).localeCompare(String(b.n),undefined,{numeric:true}));
  return `<div class="fields">
    <div class="fld-full"><label class="fld" for="rv-name">Name<input type="text" id="rv-name" value="${esc(v.name||'')}" placeholder="Guest name" autocomplete="off" autocorrect="off"></label></div>
    <div class="rvline"><label class="fld" for="rv-date">Date<input type="date" id="rv-date" value="${esc(v.date||ui.date)}"></label><label class="fld" for="rv-size">Guests<input type="number" id="rv-size" min="1" max="60" inputmode="numeric" value="${esc(v.size||'')}"></label><label class="fld" for="rv-time">Time<select id="rv-time">${RTIMES.map(x=>`<option${(v.time||'7:00 PM')===x?' selected':''}>${x}</option>`).join('')}</select></label></div>
    <label class="fld" for="rv-phone">Phone *<input type="tel" id="rv-phone" value="${esc(v.phone||'')}" placeholder="Required" required autocomplete="off"></label>
    <label class="fld" for="rv-table">Table<select id="rv-table"><option value="">Assign later</option>${tl.map(t=>`<option value="${t.id}"${v.table===t.id?' selected':''}>${esc(t.n)} · ${esc(t.area)} · ${t.shape==='stool'?'bar seat':t.standing?'standing':t.seats+' top'}</option>`).join('')}</select></label></div>
    <label class="fld" for="rv-note">Note<input type="text" id="rv-note" value="${esc(v.note||'')}" placeholder="Birthday, high chair, allergy, patio request" autocomplete="off"></label>`;

function resvSection(){
  const d=ui.date,list=resvOn(d),editing=ui.rvEdit&&ui.rvEdit!=='new'&&list.some(r=>r.id===ui.rvEdit);
  const next=[];for(let i=1;i<=7;i++){const k=addDays(iso(new Date()),i),n=resvOn(k).filter(activeResv).length;if(n)next.push([k,n])}

/* Every reservation for the night, under the floor plan. */
/* Every booked reservation after today, so a buyout or event never lands on top of one. */
function resvClashOf(r){const evs=eventsOn(r.date);if(!evs.length)return null;const tc=r.table?resvEventClash(r):null;if(tc)return tc;return r.table?null:(evs.find(o=>o.type==='buyout')||null)}
function resvFutureCard(){
  const today=svcDate(),list=Object.entries(S.resv||{}).map(([id,r])=>({id,...r})).filter(r=>r.date>today&&activeResv(r)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||resvTime(a.time)-resvTime(b.time));
  const clashes=list.filter(resvClashOf).length,by={};list.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  return fold('resvfut','Upcoming reservations',list.length?list.length+' booked'+(clashes?' · '+clashes+' clash with an event':''):'None booked',
    list.length?Object.entries(by).map(([d,rs])=>{const evs=eventsOn(d);return `<p class="grp"><span>${esc(fmt(d,{weekday:'short',month:'short',day:'numeric'}))} · ${rs.length} res · ${rs.reduce((n,r)=>n+(+r.size||0),0)} guests</span></p>${evs.length?`<p class="status" style="color:var(--warn)">Event that night: ${evs.map(o=>esc(evLabel(o))+' ('+esc(OTYPEN[o.type]||'')+(o.space?', '+esc(o.space):'')+')').join(', ')}</p>`:''}<ul class="checks plist">${rs.map(r=>{const c=resvClashOf(r);return `<li><span class="ptime">${esc(r.time||'')}</span><span style="flex:1 1 180px;min-width:0"><b>${esc(r.name)}</b> <span class="muted">${r.size?esc(r.size)+' guests':''}${r.table?' · Table '+esc(tblName(r.table)):''}</span>${r.phone?`<span class="status" style="display:block">${esc(r.phone)}</span>`:''}</span>${c?`<span class="pill warn">${c.type==='buyout'?'Buyout':'Event'}: ${esc(evLabel(c))}</span>`:''}<button class="btn x" data-act="rvjump" data-d="${d}">Open day</button></li>`}).join('')}</ul>`}).join(''):'<p class="status">No reservations after today yet.</p>',clashes?' edge':'',!clashes);
}
function resvListCard(){
  const d=ui.date,list=resvOn(d),act=list.filter(activeResv),guests=act.reduce((n,r)=>n+(+r.size||0),0);
  return fold('resvlist','Reservations · '+esc(fmt(d,{weekday:'short',month:'short',day:'numeric'})),act.length+' booked · '+guests+' guests',

function resvRead(){const g=x=>document.getElementById(x),sz=g('rv-size').value;
  return {name:(g('rv-name').value||'').trim(),size:sz===''?null:Math.max(1,+sz),date:g('rv-date').value||ui.date,time:g('rv-time').value,phone:(g('rv-phone').value||'').trim(),table:g('rv-table').value,note:(g('rv-note').value||'').trim()}}
function seatResv(rid,tid){const r=S.resv[rid];if(!r)return;
  seatSet(tid,{st:'seated',party:r.name,size:r.size||null,note:r.note||'',at:Date.now()});
  S.resv=Object.assign({},S.resv,{[rid]:Object.assign({},r,{st:'seated',table:tid})});save('resv/'+rid,{st:'seated',table:tid,seatedAt:Date.now()});
  const t=tables().find(x=>x.id===tid);if(t)ui.area=t.area==='Bar'&&ui.area==='Inside'&&onInsideToo(t)?'Inside':t.area;}
function resvClick(a,t){
  const id=t.dataset.id,g=x=>document.getElementById(x);

  if(a==='rvcancel'){document.activeElement&&document.activeElement.blur();if(ui.rvDraft&&ui.rvEdit)delete ui.rvDraft[ui.rvEdit];ui.rvEdit=null;ui.rvDel=null;ui.rvForce=null;render();return true}
  if(a==='rvedit'){ui.rvEdit=id;ui.rvDel=null;render();return true}
  if(a==='rvjump'){ui.date=t.dataset.d;S.shift={};subShiftTo(ui.date);render();return true}
  if(a==='rvpickcancel'){ui.rvPick=null;render();return true}

      if(m)m.textContent=(cf.length?'Table '+tblName(v.table)+' already has '+cf.map(r=>r.name+' at '+r.time).join(' and ')+'. ':'')+(ec?'That space is booked for '+evLabel(ec)+(ec.start?' at '+ec.start:'')+'. ':'')+'Tap '+(a==='rvadd'?'Add':'Save')+' again to book it anyway.';return true}

    const rid=a==='rvadd'?newId():id,doc=a==='rvadd'?Object.assign(v,{st:'booked',created:Date.now()}):v;
    S.resv=Object.assign({},S.resv,{[rid]:Object.assign({},S.resv[rid],doc)});save('resv/'+rid,doc);ui.rvEdit=null;if(ui.rvDraft)delete ui.rvDraft[a==='rvadd'?'new':id];ui.rvMsg=a==='rvadd'?'Booked '+v.name+(v.size?', '+v.size+' guests':'')+' for '+fmt(v.date,{weekday:'short',month:'short',day:'numeric'})+' at '+v.time+'.':'';
    if(a==='rvsave'&&v.date!==ui.date){ui.date=v.date;S.shift={};subShiftTo(ui.date)}render();return true}

  return false;
}

async function suggestTV(){

      const r=await hostCall(mcp,'preview_start',{url});const tabId=r&&r.payload&&(r.payload.tabId||(typeof r.payload==='string'?r.payload:null));

    const tvs=(out&&out.tvs||[]).filter(x=>x&&TVN[x.id]&&x.show).map(x=>({id:x.id,show:String(x.show).slice(0,60),time:String(x.time||'').slice(0,20),ch:String(x.ch||'').slice(0,40),why:String(x.why||'').slice(0,120)}));
    if(!tvs.length)throw {message:'Claude did not return a lineup. Add tonight\'s games in the box and try again.'};
    const sugg={tvs,sound:'f345',notes:(out.notes||[]).slice(0,3).map(n=>String(n).slice(0,160)),at:Date.now()};
    S.tvday=Object.assign({},S.tvday,{sugg});save('tvday/'+d,{sugg});ui.tvMsg='Lineup ready. Check it, then tap Use this lineup.';
  }catch(e){ui.tvMsg=(e&&e.code==='not_granted')?'Allow Claude for this page to suggest a lineup.':(e&&e.message)||'Could not suggest a lineup.'}
