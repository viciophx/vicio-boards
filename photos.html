<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vicio recipe photos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<style>
:root{--bg:#F6F5F3;--ink:#18181B;--muted:#5E5E66;--line:#E4E2DF;--cherry:#8B1E1E;--cherry-ink:#fff;--surface:#fff;--good:#1F6B3A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161214;--ink:#F3EFEF;--muted:#B4ABAD;--line:#3A3134;--cherry:#C8484A;--surface:#211B1D;--good:#6FCF8E;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}
main{width:min(100%,760px);margin:0 auto;padding:24px 16px 80px}
h1{margin:0 0 4px;font-size:30px;color:var(--cherry)}
p{margin:0 0 14px;color:var(--muted)}
.pick{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 22px;border-radius:12px;background:var(--cherry);color:var(--cherry-ink);font-weight:700;font-size:17px;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
ul{list-style:none;margin:18px 0;padding:0;display:grid;gap:10px}
li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
li img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--line)}
.fn{font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:6px}
select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.st{font-size:13px;margin-top:6px;min-height:1.2em}.st.ok{color:var(--good);font-weight:600}.st.bad{color:var(--cherry);font-weight:600}
.bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;background:var(--bg)}
button{font:inherit;font-weight:700;min-height:48px;padding:10px 20px;border-radius:12px;border:0;background:var(--cherry);color:var(--cherry-ink);cursor:pointer}
button:disabled{opacity:.5}
.note{font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Recipe photos</h1>
  <p>Pick all your food photos at once. Each one is matched to its recipe by the file name; check the matches, fix any that are wrong, then save. Photos show on the BOH recipe pages, right after Notes.</p>
  <label class="pick">Choose photos<input type="file" id="files" accept="image/*" multiple></label>
  <ul id="list"></ul>
  <div class="bar"><button type="button" id="save" disabled>Save all</button><span class="note" id="msg"></span></div>
</main>
<script>window.__vicioExtras = true; window.VICIO_BOARD = 'kitchen';</script>
<script src="config.js"></script>
<script src="sheetdb.js"></script>
<script>
/* Recipes on the BOH board: [id, name, group]. Matched against file names. */
var RECIPES = [["marg", "Margherita", "Pizzas: classics"], ["mixtape", "The Mixtape", "Pizzas: classics"], ["pep", "Pepperoni", "Pizzas: classics"], ["sauspep", "Sausage and Pep", "Pizzas: classics"], ["triplepep", "Triple Pepperoni", "Pizzas: classics"], ["infierno", "El Infierno", "Pizzas: signature pies"], ["pina", "La Piña Brava", "Pizzas: signature pies"], ["guera", "La Güera", "Pizzas: signature pies"], ["buffpizza", "Buffalo Chicken Pizza", "Pizzas: signature pies"], ["cochina", "La Cochina", "Pizzas: signature pies"], ["byo", "Build Your Own Pizza", "Build your own and standard portions"], ["matrix", "Standard portions, every pizza", "Build your own and standard portions"], ["fries", "Seasoned Waffle Fries", "Appetizers"], ["garlicbread", "Garlic Bread", "Appetizers"], ["mozz", "Green Chile Mozz Sticks", "Appetizers"], ["pickles", "Fried Pickles", "Appetizers"], ["baddies", "Buffalo Baddies", "Appetizers"], ["wings", "Wings", "Appetizers"], ["sidechicks", "The Side Chicks", "The Bad Chick"], ["basic", "The Basic Chick Sandwich", "The Bad Chick"], ["toxica", "La Toxica", "The Bad Chick"], ["badchick", "The Bad Chick", "The Bad Chick"], ["dough", "Pizza Dough, 20 qt batch", "Base recipes"], ["redsauce", "Pizza Sauce", "Base recipes"], ["pan", "Pan prep and oil", "Base recipes"], ["bmranch", "Buttermilk Ranch", "Sauces and dressings"], ["gpbutter", "Garlic Parm Butter", "Sauces and dressings"], ["s_matcha", "Salsa Macha", "Sauces and dressings"], ["s_buff", "Buffalo Sauce", "Sauces and dressings"], ["cheesesauce", "Green Chile Cheese Sauce", "Sauces and dressings"], ["hothoney", "Hot Honey", "Sauces and dressings"], ["scorpion", "Scorpion Hot Honey", "Sauces and dressings"], ["s_gp", "Garlic Parm wing sauce", "Sauces and dressings"], ["s_rub", "Spicy Dry Rub", "Sauces and dressings"], ["s_serrano", "Creamy Serrano Lime", "Sauces and dressings"], ["brine", "Chicken Brine", "Bad Chick prep"], ["batter", "Dry Batter (dredge)", "Bad Chick prep"], ["eggwash", "Egg Wash", "Bad Chick prep"], ["spicerub", "Bad Chick Spice Rub", "Bad Chick prep"], ["toxicaspice", "Toxica Spice", "Bad Chick prep"], ["slaw", "Coleslaw", "Bad Chick prep"], ["thighprep", "Chicken Thigh Prep", "Bad Chick prep"], ["pineapple", "Roasted Pineapple", "Prep items with no card yet"], ["jalapeno", "Roasted Jalapeños", "Prep items with no card yet"], ["pickledonion", "Pickled Red Onions", "Prep items with no card yet"], ["carnitas", "Carnitas", "Prep items with no card yet"], ["friedchx", "Crispy Fried Chicken for pizza", "Prep items with no card yet"], ["sausage", "Spicy Sausage", "Prep items with no card yet"], ["wingsprep", "Wings, cook spec", "Prep items with no card yet"], ["meatballs", "Meatballs", "Appetizers"]];
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function stripThe(s) { return s.replace(/^(the|la|el) /, ''); }
/* Best match: the recipe named first in the file name (the main dish; others may be in the background),
   and on a tie the longest name, so Triple Pepperoni beats Pepperoni. */
function match(file) {
  var f = ' ' + norm(file.replace(/\.[a-z]+$/i, '')) + ' ', best = null, at = Infinity, len = 0;
  RECIPES.forEach(function (r) {
    [norm(r[1]), stripThe(norm(r[1]))].forEach(function (n) {
      var i = n.length > 3 ? f.indexOf(' ' + n + ' ') : -1;
      if (i >= 0 && (i < at || (i === at && n.length > len))) { best = r[0]; at = i; len = n.length; }
    });
  });
  return best;
}
function compress(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, m = 1000;
      if (w > m || h > m) { var k = Math.min(m / w, m / h); w = Math.round(w * k); h = Math.round(h * k); }
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u);
      var q = .75, d = cv.toDataURL('image/jpeg', q);
      while (d.length > 180000 && q > .3) { q -= .1; d = cv.toDataURL('image/jpeg', q); }
      res(d);
    };
    img.onerror = function () { URL.revokeObjectURL(u); rej('read'); };
    img.src = u;
  });
}
var rows = [];
var opts = '<option value="">Skip this photo</option>' + RECIPES.map(function (r) { return '<option value="' + r[0] + '">' + r[1].replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</option>'; }).join('');
document.getElementById('files').addEventListener('change', function (e) {
  var list = document.getElementById('list');
  Array.prototype.forEach.call(e.target.files, function (file) {
    var li = document.createElement('li'), id = match(file.name);
    li.innerHTML = '<img alt=""><div><div class="fn"></div><select aria-label="Recipe for this photo">' + opts + '</select><div class="st"></div></div>';
    li.querySelector('img').src = URL.createObjectURL(file);
    li.querySelector('.fn').textContent = file.name;
    li.querySelector('select').value = id || '';
    li.querySelector('.st').textContent = id ? '' : 'No match found. Pick the recipe, or skip it.';
    list.appendChild(li);
    rows.push({ file: file, li: li });
  });
  e.target.value = '';
  document.getElementById('save').disabled = !rows.length;
});
document.getElementById('save').addEventListener('click', async function () {
  if (!window.VicioStore) { document.getElementById('msg').textContent = 'Not connected to the Vicio sheet.'; return; }
  var btn = this, done = 0, todo = rows.filter(function (r) { return !r.saved && r.li.querySelector('select').value; });
  btn.disabled = true;
  for (var i = 0; i < todo.length; i++) {
    var r = todo[i], id = r.li.querySelector('select').value, st = r.li.querySelector('.st');
    st.className = 'st'; st.textContent = 'Saving\u2026';
    try {
      var img = await compress(r.file);
      await VicioStore.db.doc('rphotos/' + id).update({ img: img });
      await VicioStore.db.doc('rcards/' + id).update({ hasPhoto: true });
      r.saved = true; done++; st.className = 'st ok'; st.textContent = 'Saved to ' + r.li.querySelector('select').selectedOptions[0].textContent + '.';
    } catch (e) { st.className = 'st bad'; st.textContent = e === 'read' ? (/image\/hei[cf]/i.test(r.file.type || '') || /\.hei[cf]$/i.test(r.file.name || '') ? 'Couldn\u2019t read that photo. HEIC photos from a Mac don\u2019t load here: upload from the iPhone or iPad, or save it as JPEG first.' : 'Couldn\u2019t read that photo. Try a JPEG or PNG.') : 'Not saved. Check the connection and tap Save all again.'; }
  }
  document.getElementById('msg').textContent = done ? done + ' saved. Open the recipe on the BOH board to see it.' : '';
  btn.disabled = !rows.some(function (r) { return !r.saved; });
});
</script>
</body>
</html>
